apiVersion: apps/v1
kind: Deployment
metadata:
  name: baanlomnow-app
  namespace: baanlomnow
  labels:
    app: baanlomnow
    component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: baanlomnow
      component: app
  template:
    metadata:
      labels:
        app: baanlomnow
        component: app
    spec:
      serviceAccountName: baanlomnow-sa
      containers:
      - name: baanlomnow-app
        # Production: Use Artifact Registry image
        # Using digest instead of tag to avoid platform mismatch issues
        image: asia-southeast1-docker.pkg.dev/project-14a6d9ab-7aaf-49a0-92d/baanlomnow-repository/baanlomnow@sha256:001dd5ab6a59a02538804e45093328f41381c7cd2c984653124bd856a4405111
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: baanlomnow-config
              key: NODE_ENV
        - name: NEXT_TELEMETRY_DISABLED
          valueFrom:
            configMapKeyRef:
              name: baanlomnow-config
              key: NEXT_TELEMETRY_DISABLED
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: baanlomnow-config
              key: PORT
        - name: HOSTNAME
          valueFrom:
            configMapKeyRef:
              name: baanlomnow-config
              key: HOSTNAME
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: baanlomnow-secrets
              key: MONGODB_URI
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: baanlomnow-secrets
              key: DATABASE_URL
        - name: NEXTAUTH_URL
          valueFrom:
            secretKeyRef:
              name: baanlomnow-secrets
              key: NEXTAUTH_URL
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: baanlomnow-secrets
              key: NEXTAUTH_SECRET
        - name: GOOGLE_CLOUD_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: baanlomnow-secrets
              key: GOOGLE_CLOUD_PROJECT_ID
        - name: GOOGLE_CLOUD_STORAGE_BUCKET
          valueFrom:
            secretKeyRef:
              name: baanlomnow-secrets
              key: GOOGLE_CLOUD_BUCKET_NAME
        - name: GOOGLE_CLOUD_BUCKET_NAME
          valueFrom:
            secretKeyRef:
              name: baanlomnow-secrets
              key: GOOGLE_CLOUD_BUCKET_NAME
        - name: STRIPE_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: baanlomnow-secrets
              key: STRIPE_PUBLIC_KEY
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: baanlomnow-secrets
              key: STRIPE_SECRET_KEY
        - name: RESEND_API_KEY
          valueFrom:
            secretKeyRef:
              name: baanlomnow-secrets
              key: RESEND_API_KEY
        - name: LINE_CHANNEL_ID
          valueFrom:
            secretKeyRef:
              name: baanlomnow-secrets
              key: LINE_CHANNEL_ID
        - name: LINE_CHANNEL_SECRET
          valueFrom:
            secretKeyRef:
              name: baanlomnow-secrets
              key: LINE_CHANNEL_SECRET
        - name: LINE_CHANNEL_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: baanlomnow-secrets
              key: LINE_CHANNEL_ACCESS_TOKEN
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: baanlomnow-secrets
              key: STRIPE_WEBHOOK_SECRET
        - name: LINE_ADMIN_USER_ID
          valueFrom:
            secretKeyRef:
              name: baanlomnow-secrets
              key: LINE_ADMIN_USER_ID
        - name: NEXT_PUBLIC_APP_URL
          valueFrom:
            secretKeyRef:
              name: baanlomnow-secrets
              key: NEXT_PUBLIC_APP_URL
        - name: NEXT_PUBLIC_STRIPE_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: baanlomnow-secrets
              key: STRIPE_PUBLIC_KEY
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "384Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
      # Production: Using imagePullSecrets for Artifact Registry authentication
      # Note: Can switch to Workload Identity after node pool fully updates
      imagePullSecrets:
      - name: artifact-registry-json-key
