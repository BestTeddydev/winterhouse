apiVersion: v1
kind: ServiceAccount
metadata:
  name: baanlomnow-sa
  namespace: baanlomnow

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: baanlomnow-node-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- kind: ServiceAccount
  name: baanlomnow-sa
  namespace: baanlomnow

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: baanlomnow
  name: pod-reader
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "watch", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-pods
  namespace: baanlomnow
subjects:
- kind: ServiceAccount
  name: baanlomnow-sa
  namespace: baanlomnow
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io

