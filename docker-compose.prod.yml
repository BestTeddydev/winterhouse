# Production on a single server (DigitalOcean droplet).
# Data lives in Firestore and files in Firebase Storage, so there is no database container.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Needs next to this file: .env (app settings) and secrets/baanlomnow-firebase.json

services:
  # Next.js application (only reachable through Caddy)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baanlomnow-app
    restart: always
    expose:
      - "3000"
    environment:
      # Firebase (Firestore + Storage)
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/firebase.json
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-baanlomnow-3501a}
      - FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET:-baanlomnow-3501a.firebasestorage.app}

      # NextAuth
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}

      # LINE Login
      - LINE_CHANNEL_ID=${LINE_CHANNEL_ID}
      - LINE_CHANNEL_SECRET=${LINE_CHANNEL_SECRET}

      # LINE Messaging API
      - LINE_CHANNEL_ACCESS_TOKEN=${LINE_CHANNEL_ACCESS_TOKEN}
      - LINE_ADMIN_USER_ID=${LINE_ADMIN_USER_ID}

      # Stripe Payment Gateway
      - STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}

      # Email Service
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PHONE=${ADMIN_PHONE}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}

      # App URLs
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - NEXT_PUBLIC_STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}

      # Node
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - ./secrets/baanlomnow-firebase.json:/app/secrets/firebase.json:ro
    networks:
      - baanlomnow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G

  # Reverse proxy with automatic HTTPS (Let's Encrypt)
  caddy:
    image: caddy:2-alpine
    container_name: baanlomnow-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-baanlomnow.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - baanlomnow-network

volumes:
  caddy_data:
  caddy_config:

networks:
  baanlomnow-network:
    driver: bridge
